<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Reset Password – Ponugoti Hospital</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="login-form-panel" style="flex:1">
    <div class="login-form-inner">
      <h2>Set a new password</h2>
      <p class="login-sub" id="sub-line">Checking your reset link…</p>

      <div id="msg-area"></div>

      <div id="form-box" style="display:none">
        <label class="field">
          New password
          <input type="password" id="pw1" placeholder="At least 8 characters" autocomplete="new-password"/>
        </label>
        <label class="field">
          Confirm new password
          <input type="password" id="pw2" placeholder="Type it again" autocomplete="new-password"/>
        </label>
        <button class="btn" id="save-btn"><i class="ti ti-lock-check"></i> Save new password</button>
      </div>

      <p class="login-footer-note" id="back-box" style="display:none">
        <a href="login.html">← Back to sign in</a>
      </p>
    </div>
  </div>
</div>

<script>
(function () {
  const cfg = window.PONUGOTI_CONFIG;
  const client = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true, storageKey: 'ponugoti-hospital-auth' },
  });

  const msgArea = document.getElementById('msg-area');
  const subLine = document.getElementById('sub-line');
  const formBox = document.getElementById('form-box');
  const backBox = document.getElementById('back-box');
  function setMsg(kind, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.textContent = text;
    msgArea.replaceChildren(div);
  }

  let ready = false;
  function showForm() {
    if (ready) return;
    ready = true;
    subLine.textContent = 'Choose a new password for your staff account.';
    formBox.style.display = '';
  }
  function showInvalid() {
    if (ready) return;
    subLine.textContent = 'This reset link is invalid or has expired.';
    setMsg('error', 'Go back to the sign-in page and click "Forgot password?" to get a fresh link.');
    backBox.style.display = '';
  }

  // The recovery link puts a session in the URL; supabase-js parses it automatically.
  client.auth.onAuthStateChange((event, session) => {
    if (session && (event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) showForm();
  });
  client.auth.getSession().then(({ data }) => { if (data.session) showForm(); });
  setTimeout(() => { if (!ready) showInvalid(); }, 4000);

  document.getElementById('save-btn').addEventListener('click', async () => {
    const p1 = document.getElementById('pw1').value;
    const p2 = document.getElementById('pw2').value;
    if (p1.length < 8) { setMsg('error', 'Password must be at least 8 characters.'); return; }
    if (p1 !== p2) { setMsg('error', 'The two passwords do not match.'); return; }
    const btn = document.getElementById('save-btn');
    btn.disabled = true;
    const { error } = await client.auth.updateUser({ password: p1 });
    btn.disabled = false;
    if (error) { setMsg('error', error.message || 'Could not update the password.'); return; }
    setMsg('success', 'Password updated. Taking you to the dashboard…');
    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1200);
  });
})();
</script>
</body>
</html>
